<style>

nav{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.push{display:flex;gap:10px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:.84rem}

/* 내 출결: 1줄 날짜(기간)·일수, 2줄 종류(교시) — 하루든 여러 날이든 같은 모양 */
.att .ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.att .ev .d{grid-column:1;grid-row:1;width:auto;min-width:0}.att .ev .days{grid-column:2;grid-row:1}.att .ev .t{grid-column:1 / -1;grid-row:2;min-width:0}
.att .ev .d{width:auto;min-width:6.2em}.att .days{flex:none;font-weight:700;color:var(--sun);font-size:.84rem}
body{background:var(--desk)!important;letter-spacing:-.01em}
header{background:var(--navy);background-image:radial-gradient(420px 160px at 100% 0,color-mix(in srgb,var(--lime) 22%,transparent),transparent 70%)}
header h1{font-weight:900;letter-spacing:-.03em;font-size:1.45rem}

.card{border-radius:16px;border-color:var(--line)}.card.today{border-color:var(--green);box-shadow:inset 4px 0 0 var(--lime)}

.hbtn{border-radius:999px}

@media (prefers-color-scheme:dark){nav button[aria-selected="true"]{color:var(--lime)}}
.tag{border-radius:999px}.field{border-radius:12px}
.tt th{background:var(--paper2)}.tt .on{background:var(--mint)}.tt td.now{outline-color:var(--lime)}

.ttpick{margin:6px 0 4px;text-align:left}
.cal button.cd{border:0;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}.daydlg{border:0;border-radius:20px;padding:22px 20px 16px;width:min(420px,calc(100vw - 32px));background:var(--paper);color:var(--ink);box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.daydlg::backdrop{background:rgba(15,29,20,.45)}.daydlg h2{margin:0 0 10px;font-size:1.3rem}.daydlg h2.red{color:var(--sun)}
.daydlg .ev{font-size:1.08rem;padding:12px 0}.daydlg .t{white-space:normal}.daydlg>.small-btn{display:block;margin:14px 0 0 auto}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.calhead h2{margin:10px 0}

.cal .cd b{font-size:.78rem;font-weight:700}.cal .red,.cal .red b{color:var(--sun)}
.cal .cd.on{outline:2px solid var(--lime);background:var(--mint)}
.cal .ce{font-size:.64rem;line-height:1.25;background:var(--paper);border-radius:4px;padding:1px 3px;word-break:break-all;color:var(--ink)}.cal .ce.mine{box-shadow:inset 2px 0 0 var(--green)}
.setrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}.setrow:first-of-type{border-top:0}
.setrow b{flex:1}.setrow .small-btn{min-width:2.4em}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<body>
<div id="loginView" class="login" hidden>
  <img src="icon-192.png" alt="">
  <h1>우리 반 알림</h1>
  <p class="hint">조·종례 공지, 학사일정, 제출물, 내 시간표를 볼 수 있어요.<br>학번(5자리)과 비밀번호로 들어와요. 비밀번호는 담임 선생님께 받아요. (학생·학부모 같은 비밀번호)</p>
  <form id="loginForm">
    <input id="no" class="field" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="username" placeholder="학번 (예: 30301)" aria-label="학번 5자리">
    <input id="pw" class="field" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
    <label class="inline"><input type="checkbox" id="remember" checked> 이 기기 기억하기 (다음부터 비밀번호 없이)</label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn" type="submit">들어가기</button>
  </form>
  <div class="alt"><button class="btn" id="teacherBtn" type="button">담임 선생님 로그인</button></div>
</div>

<div id="appView" hidden>
  <header>
    <h1 id="title">우리 반<small id="sub"></small></h1>
    <button class="hbtn" id="setBtn" type="button" aria-label="알림 앱 설정" hidden>⚙</button>
    <button class="hbtn" id="pushBtn" type="button" hidden>🔕</button>
    <button class="hbtn" id="refresh" type="button" aria-label="새로 고침">↻</button>
    <button class="hbtn" id="logout" type="button">나가기</button>
  </header>
  <main id="view"></main>
  <nav role="tablist" aria-label="보기">
    <button role="tab" data-v="notes" type="button"><span aria-hidden="true">📢</span>공지</button>
    <button role="tab" data-v="events" type="button"><span aria-hidden="true">📅</span>일정</button>
    <button role="tab" data-v="checks" type="button"><span aria-hidden="true">📝</span>제출물</button>
    <button role="tab" data-v="tt" type="button"><span aria-hidden="true">🕘</span>시간표</button>
    <button role="tab" data-v="att" type="button" hidden><span aria-hidden="true">✅</span>출결</button>
  </nav>
</div>

<script>
// 우리 반 알림: 교무수첩이 선생님 구글 드라이브에 올린 것을 앱스 스크립트 창구에서 받아 옴 (Firebase 에는 자료가 없음)
// 학생·학부모는 학번+비밀번호, 선생님은 [담임 선생님 로그인] + 교무수첩에서 정한 선생님 비밀번호
const GW = "https://script.google.com/macros/s/AKfycbxQQ2Ey6iabBG6gF4itZKU_Uph_3B-iw7UMFVr70scykko7nUcSEB-UkwtooN1v2ED-Jw/exec";
// 휴대폰 알림만 Firebase(구글 알림 서버)를 거침: 알림 열쇠를 받는 데만 씀
const FB = { apiKey:"AIzaSyCO4Mc-lGPDZWddX1E5WwAVFBh5ofc2cvc", projectId:"gyomu-7e9e1", messagingSenderId:"778560026907", appId:"1:778560026907:web:82f4dab5fcbe9fcc86fbbe" };
// 휴대폰 알림 열쇠 (Firebase 프로젝트 설정 → 클라우드 메시징 → 웹 푸시 인증서). 비어 있으면 '알림 받기' 단추를 숨김
const VAPID = "BBDEneVG6KJ7Xoy6shrLKrAKKjA7Y8qJPVCCsmbu2yQZWH18Qh83lWXtPi4AWAiakSj4PoEbyShAJapsIVIEKRg";
firebase.initializeApp(FB);
// 창구 부르기 (글자로 보내야 구글이 막지 않음)
async function api(body){
  const r = await fetch(GW, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) });
  if(!r.ok) throw new Error("인터넷 연결을 확인해 주세요."); return r.json();
}
// 들어온 표: '기억하기'면 이 기기에, 아니면 이 창에만
const sess = { get:() => store.get("gwToken"), set:(t, keep) => { store.del("gwToken"); store.set("gwToken", t, keep); }, del:() => store.del("gwToken") };
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.flat(2).forEach(k => k != null && k !== "" && k !== false && e.append(k)); return e; };
// 저장소는 막혀 있을 수 있음 (비공개 창 등)
const store = { get(k){ try{ return localStorage.getItem(k) ?? sessionStorage.getItem(k); }catch{ return null; } },
  set(k, v, keep){ try{ (keep ? localStorage : sessionStorage).setItem(k, v); }catch{} }, del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch{} } };
let data = null, view = store.get("classView") || "notes", lastFetch = 0, preview = "", ttKid = "";
// 탭 순서·보이기: 선생님이 이 앱(구글 로그인)에서 정함 → notice 문서의 ui
const TABS = { notes:"공지", events:"일정", checks:"제출물", tt:"시간표", att:"출결" };
const uiOf = () => { const u = data?.ui || {}, order = (u.order || []).filter(k => TABS[k]); Object.keys(TABS).forEach(k => { if(!order.includes(k)) order.push(k); }); return { order, hide:new Set(u.hide || []) }; };
const isTeacher = () => String(sess.get() || "").startsWith("T.");
// 미리 보기 중이면 학생 몫(출결 탭 등)도 보이게: applyTabs 는 data.my 로 판단
const WD = ["일","월","화","수","목","금","토"], DAYS = ["월","화","수","목","금"];
const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const label = k => { const d = parse(k); return (d.getMonth() + 1) + "/" + d.getDate() + " (" + WD[d.getDay()] + ")"; };
const today = () => ymd(new Date());
const hakbun = n => { const m = String(data?.cls || "").match(/^(\d)\s*-\s*(\d+)$/); return m ? m[1] + String(m[2]).padStart(2, "0") + String(n).padStart(2, "0") : n + "번"; };
const dday = k => Math.round((parse(k) - parse(today())) / 864e5);
const ddTag = k => { const n = dday(k); return el("span",{className:"dd" + (n < 0 ? " past" : n <= 2 ? " soon" : ""), textContent: n === 0 ? "오늘" : n > 0 ? "D-" + n : "지남"}); };

const within = (p, ms, what) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(what + " 단계에서 멈췄어요. 앱을 완전히 닫았다가 다시 열고 한 번 더 눌러 주세요.")), ms))]);
let pushBusy = false;
async function enablePush(){
  if(pushBusy) return; pushBusy = true;
  const pb = $("pushBtn"); pb.textContent = "⏳"; pb.disabled = true;
  try{
    if(!("Notification" in window) || !firebase.messaging.isSupported()) throw new Error("이 브라우저는 알림을 못 받아요. 아이폰은 사파리에서 '홈 화면에 추가'한 앱으로 열어서 켜 주세요.");
    if(await Notification.requestPermission() !== "granted") throw new Error("알림이 꺼져 있어요. 휴대폰 설정 → 알림 → '우리 반 알림'에서 알림 허용을 켠 뒤 다시 눌러 주세요.");
    const reg = await within(navigator.serviceWorker.ready, 10000, "앱 준비");
    const token = await within(firebase.messaging().getToken({ vapidKey:VAPID, serviceWorkerRegistration:reg }), 20000, "알림 열쇠 받기");
    const r = await within(api({ act:"push", token:sess.get(), fcm:token }), 20000, "등록"); if(r.error) throw new Error(r.error);
    store.set("pushOn", token, true); alert("알림을 켰어요. 이제 선생님 알림이 휴대폰에 떠요.");
  }catch(x){ alert("알림을 켜지 못했어요.\n" + (x.message || x)); }
  pushBusy = false; pb.disabled = false; draw();
}

// 수업 시간: 선생님이 정한 것, 없으면 8:10 시작·50분 수업·10분 쉬고·4교시 뒤 점심 60분
function bells(){
  const out = []; let m = 8 * 60 + 10; const hm = x => String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0");
  for(let i = 0; i < 10; i++){ out.push({ s:hm(m), e:hm(m + 50) }); m += 50 + (i === 3 ? 60 : 10); }
  return out.map((d, i) => { const b = data.bells?.[i]; return b && b.s && b.e ? b : d; });
}

  const cell = v => { const [a, b] = String(v || "").split("\n"); return [a || "", b ? el("small",{textContent:b}) : ""]; };
  return el("section",{}, pick, el("h2",{}, mine ? (who.name || who.no + "번") + " 시간표" : "우리 반 시간표", mine ? el("small",{textContent:"반 숫자는 이동 교실"}) : ""),
    el("table",{className:"tt"}, el("thead",{}, el("tr",{}, el("th",{textContent:"교시"}), ...DAYS.map((d, j) => el("th",{className:j === wd ? "on" : "",textContent:d})))),
      el("tbody",{}, ...tt.cells.slice(0, tt.periods).map((r, i) => el("tr",{}, el("th",{}, String(i + 1), el("small",{textContent:B[i].s})),
        ...DAYS.map((_, j) => el("td",{className:(j === wd ? "on" : "") + (j === wd && i === cur ? " now" : "")}, ...cell(r[j]))))))),
    el("p",{className:"hint",textContent:"바뀐 수업은 조·종례 공지로 알려 줘요."}));
}
// 출결 조회 (학생·학부모): 날짜·종류·교시·수업일 수만. 사유는 안 보임
function drawAtt(){
  const list = data.my?.att || [], sum = {};
  list.forEach(r => { sum[r.type] = (sum[r.type] || 0) + (r.days || 1); });
  const total = list.reduce((n, r) => n + (r.days || 1), 0);
  return el("section",{className:"att"}, el("h2",{}, "내 출결", el("small",{textContent:list.length ? "총 " + list.length + "건 / " + total + "일" : ""})),
    list.length ? [el("div",{className:"chips"}, ...Object.entries(sum).map(([t, n]) => el("span",{className:"chip",textContent:t + " " + n + "일"}))),
      el("div",{className:"card"}, ...list.map(r => el("div",{className:"ev"}, el("span",{className:"d",textContent:label(r.s) + (r.e && r.e !== r.s ? " ~ " + label(r.e) : "")}),
        el("span",{className:"t"}, r.type, el("small",{className:"hint",textContent:" (" + (r.period || "-") + ")"})), el("span",{className:"days",textContent:(r.days || 1) + "일"}))))]
      : el("p",{className:"empty",textContent:"등록된 출결 기록이 없어요. 정상 출석 중이에요."}),
    el("p",{className:"hint",textContent:"참고용이에요. 일수는 실제 수업일 기준(주말·공휴일·재량휴업일 제외)이고, 정확한 출결은 담임 선생님께 여쭤 보세요."}));
}
// 휴대폰 알림 켜기 안내 (알림 열쇠가 있고 아직 안 켰을 때)
function pushTip(){
  if(!VAPID || store.get("pushOn") || store.get("pushTipOff")) return null;
  const b = el("button",{className:"small-btn",type:"button",textContent:"알림 받기"}); b.onclick = () => enablePush();
  const x = el("button",{className:"small-btn",type:"button",textContent:"받지 않기"}); x.onclick = () => { store.set("pushTipOff", "1", true); draw(); };
  return el("div",{className:"push"}, el("span",{}, "🔔 선생님 알림을 휴대폰으로 받을까요?", el("small",{className:"hint",textContent:" 나중에 위 🔕 단추로 바꿀 수 있어요."})), b, x);
}
// 홈 화면에 추가 안내 (이미 앱으로 열었거나 닫았으면 안 보임)
let deferred = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; draw(); });
function installTip(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(standalone || store.get("installTipOff")) return null;
  const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua);
  if(!deferred && !ios && !/android/i.test(ua)) return null;
  const x = el("button",{className:"x",type:"button",textContent:"✕","aria-label":"안내 닫기"}); x.onclick = () => { store.set("installTipOff", "1", true); draw(); };
  // 카톡·네이버·인스타 등 앱 안 브라우저는 '홈 화면에 추가'가 안 됨 → 바깥 브라우저로
  const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
  const body = inApp ? (() => {
      const go = el("button",{className:"small-btn",type:"button",textContent:ios ? "사파리로 열기" : "크롬으로 열기"});
      go.onclick = () => { const u = location.href;
        location.href = /KAKAOTALK/i.test(ua) ? "kakaotalk://web/openExternal?url=" + encodeURIComponent(u)
          : /android/i.test(ua) ? "intent://" + u.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end" : u; };
      return [el("span",{textContent:"지금은 앱 안 브라우저라 홈 화면에 추가할 수 없어요. "}), go,
        ios && !/KAKAOTALK/i.test(ua) ? el("small",{className:"hint",textContent:" 안 열리면 오른쪽 위 메뉴 → '다른 브라우저로 열기'"}) : ""]; })()
    : deferred ? (() => { const b = el("button",{className:"small-btn",type:"button",textContent:"홈 화면에 추가"}); b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; draw(); }; return [el("span",{textContent:"앱처럼 쓰려면 "}), b]; })()
    // 아이폰은 사이트가 설치 단추를 띄울 수 없음: 공유 메뉴로만 (iOS 26 은 ⋯ 안에 공유)
    : ios ? [el("span",{textContent:"아이폰은 직접 넣어야 해요: 사파리 아래 공유(□↑) 또는 ⋯ → 공유 → '홈 화면에 추가' → '웹 앱으로 열기' 켜고 추가."})]
    : [el("span",{textContent:"앱처럼 쓰려면 크롬 메뉴(⋮) → '홈 화면에 추가'를 누르세요."})];
  return el("div",{className:"install"}, el("img",{src:"icon-192.png",alt:""}), el("div",{}, ...body), x);
}

// 시작: 기억해 둔 내용을 먼저 보여 주고, 바로 새로 받음
try{ const c = JSON.parse(store.get("classData") || "null"); if(c){ data = c.d; lastFetch = c.at; $("appView").hidden = false; applyTabs(); draw(); } }catch{}
setInterval(() => { if(data && view === "tt") draw(); }, 60e3);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
