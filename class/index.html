<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>우리 반 알림</title>
<meta name="description" content="조·종례 공지, 학사일정, 제출물 마감, 우리 반 시간표">
<meta name="theme-color" content="#3f5c9e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 반">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 교무수첩과 같은 공책 느낌. 휴대폰 한 손으로 보기 좋게: 위 제목, 아래 탭 */
:root{--paper:#fffdf9;--paper2:#f5f2ec;--ink:#2a2a2c;--muted:#6c6862;--line:#e5e0d7;--dot:#e4ded3;--navy:#3f5c9e;--sun:#c8453b;--green:#5f9a7c;--ochre:#d09a3e;
  --display:"Gaegu","Nanum Pen Script",cursive;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c1d1f;--paper2:#26272a;--ink:#ebe7e0;--muted:#a39f98;--line:#34363a;--dot:#2c2e31;--navy:#8aa2dc;--sun:#e77b70;--green:#7fb898;--ochre:#e0b060}}
:root[data-theme="dark"]{--paper:#1c1d1f;--paper2:#26272a;--ink:#ebe7e0;--muted:#a39f98;--line:#34363a;--dot:#2c2e31;--navy:#8aa2dc;--sun:#e77b70;--green:#7fb898;--ochre:#e0b060}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(circle,var(--dot) 1px,transparent 1.4px) 0 0/20px 20px,var(--paper);color:var(--ink);font:15px/1.6 var(--body);word-break:keep-all;overflow-wrap:break-word;min-height:100dvh}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font:700 1.6rem/1.1 var(--display);flex:1}
header small{display:block;font:400 .78rem var(--body);opacity:.85}
.hbtn{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:.82rem;cursor:pointer;min-height:34px}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--muted);font:600 .82rem var(--body);padding:8px 0 10px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-height:56px}
nav button span{font-size:1.25rem;line-height:1}
nav button[aria-selected="true"]{color:var(--navy)}
nav button[aria-selected="true"]::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--navy)}
h2{font:700 1.35rem var(--display);margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 .78rem var(--body);color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.card.today{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
.date{font-weight:600;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.card.today .date{color:var(--navy)}
.note{padding:6px 0;border-top:1px dashed var(--line)}
.note:first-of-type{border-top:0}
.tag{display:inline-block;font-size:.7rem;padding:0 6px;border-radius:8px;background:var(--paper2);color:var(--muted);margin-right:6px;vertical-align:1px}
.detail{white-space:pre-wrap;font-size:.86rem;color:var(--muted);margin-top:2px}
a{color:var(--navy)}
.ev{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line)}
.ev:first-child{border-top:0}
.ev .d{flex:none;width:6.2em;color:var(--muted);font-size:.86rem}
.ev .t{flex:1}
.ev.red .t,.ev.red .d{color:var(--sun)}
.ev.on{font-weight:600}
.dd{flex:none;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--paper2);color:var(--muted)}
.dd.soon{background:color-mix(in srgb,var(--sun) 15%,var(--paper));color:var(--sun)}
.dd.past{background:var(--paper2);color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.tt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.8rem;background:var(--paper)}
.tt th,.tt td{border:1px solid var(--line);padding:5px 2px;text-align:center;height:44px}
.tt th{background:var(--paper2);font-weight:600}
.tt th small{display:block;font-weight:400;font-size:.62rem;color:var(--muted)}
.tt td small{display:block;font-size:.66rem;color:var(--muted)}
.tt .on{background:color-mix(in srgb,var(--navy) 9%,var(--paper))}
.tt td.now{outline:3px solid var(--sun);outline-offset:-3px;font-weight:700}
.login{max-width:360px;margin:12vh auto 0;padding:0 16px;text-align:center}
.login h1{font:700 2.4rem var(--display);margin:12px 0 4px}
.login img{width:84px;height:84px;border-radius:20px}
.field{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);color:var(--ink);margin:14px 0 8px;text-align:center}
.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--navy);color:#fff;font:600 1rem var(--body);cursor:pointer;min-height:48px}
.btn:disabled{opacity:.6}
.err{color:var(--sun);min-height:1.4em;font-size:.88rem;margin-top:8px}
.hint{color:var(--muted);font-size:.8rem}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.install{display:flex;gap:10px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:.84rem}
.install img{width:36px;height:36px;border-radius:9px}
.install .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer}
.small-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.stale{font-size:.78rem;color:var(--muted);text-align:right;margin:2px 0 0}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.login .field+.field{margin-top:0}
.ok{flex:none;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--green) 18%,var(--paper));color:var(--green)}
.no{flex:none;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--sun) 15%,var(--paper));color:var(--sun)}
.card.msg{border-color:var(--ochre);box-shadow:inset 4px 0 0 var(--ochre)}
.msgtext{white-space:pre-wrap}
.msg .note.new .msgtext{font-weight:600}
nav button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--sun);color:#fff;font-size:.66rem;line-height:16px}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <img src="icon-192.png" alt="">
  <h1>우리 반 알림</h1>
  <p class="hint">조·종례 공지, 학사일정, 제출물, 내 시간표를 볼 수 있어요.<br>번호와 비밀번호는 담임 선생님께 받아요.</p>
  <form id="loginForm">
    <input id="no" class="field" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="username" placeholder="번호 (예: 7)" aria-label="출석 번호">
    <input id="pw" class="field" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
    <label class="inline"><input type="checkbox" id="remember" checked> 이 기기 기억하기 (다음부터 비밀번호 없이)</label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn" type="submit">들어가기</button>
  </form>
</div>

<div id="appView" hidden>
  <header>
    <h1 id="title">우리 반<small id="sub"></small></h1>
    <button class="hbtn" id="refresh" type="button" aria-label="새로 고침">↻</button>
    <button class="hbtn" id="logout" type="button">나가기</button>
  </header>
  <main id="view"></main>
  <nav role="tablist" aria-label="보기">
    <button role="tab" data-v="notes" type="button"><span aria-hidden="true">📢</span>공지</button>
    <button role="tab" data-v="events" type="button"><span aria-hidden="true">📅</span>일정</button>
    <button role="tab" data-v="checks" type="button"><span aria-hidden="true">📝</span>제출물</button>
    <button role="tab" data-v="tt" type="button"><span aria-hidden="true">🕘</span>시간표</button>
  </nav>
</div>

<script>
// 공지 서버: 교무수첩 시트에서 '공개'로 둔 것만 비밀번호가 맞을 때 보내 줌
const API = "https:" + "/" + "/script.google.com/macros/s/AKfycbxQQ2Ey6iabBG6gF4itZKU_Uph_3B-iw7UMFVr70scykko7nUcSEB-UkwtooN1v2ED-Jw/exec";
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.flat().forEach(k => k != null && k !== "" && e.append(k)); return e; };
// 저장소는 막혀 있을 수 있음 (비공개 창 등)
const store = { get(k){ try{ return localStorage.getItem(k) ?? sessionStorage.getItem(k); }catch{ return null; } },
  set(k, v, keep){ try{ (keep ? localStorage : sessionStorage).setItem(k, v); }catch{} }, del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch{} } };
let data = null, view = store.get("classView") || "notes", lastFetch = 0;

async function api(body){
  const r = await fetch(API, { method:"POST", body:JSON.stringify(body) }); // text/plain 이라 바로 보냄
  if(!r.ok) throw new Error("서버에 닿지 못했어요.");
  return r.json();
}
const WD = ["일","월","화","수","목","금","토"], DAYS = ["월","화","수","목","금"];
const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const label = k => { const d = parse(k); return (d.getMonth() + 1) + "/" + d.getDate() + " (" + WD[d.getDay()] + ")"; };
const today = () => ymd(new Date());
const dday = k => Math.round((parse(k) - parse(today())) / 864e5);
const ddTag = k => { const n = dday(k); return el("span",{className:"dd" + (n < 0 ? " past" : n <= 2 ? " soon" : ""), textContent: n === 0 ? "오늘" : n > 0 ? "D-" + n : "지남"}); };
const HOLI = /(공휴일|대체공휴일|휴업|방학|추석|설날|한글날|개천절|성탄절|어린이날|현충일|광복절|삼일절)/;
// 글 속 주소는 눌러서 열 수 있게 (글은 글자로만 넣음)
const linkify = t => String(t).split(/(https?:\/\/[^\s]+)/g).map((p, i) => i % 2 ? el("a",{href:p,target:"_blank",rel:"noopener noreferrer",textContent:p}) : p);

function showLogin(msg){
  $("appView").hidden = true; $("loginView").hidden = false; $("loginErr").textContent = msg || "";
  setTimeout(() => $("no").focus(), 0);
}
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const b = $("loginBtn"); b.disabled = true; $("loginErr").textContent = "";
  try{
    const no = $("no").value.trim();
    const r = await api(no ? { no, pw: $("pw").value } : { pw: $("pw").value });
    if(r.error) throw new Error(r.error);
    const keep = $("remember").checked;
    store.del("classToken"); store.set("classToken", r.token, keep);
    $("pw").value = ""; got(r.data, keep);
  }catch(x){ $("loginErr").textContent = x.message || "들어가지 못했어요. 잠시 뒤 다시 해 주세요."; }
  b.disabled = false;
};
$("logout").onclick = () => { if(!confirm("이 기기에서 나갈까요? 다시 보려면 비밀번호를 넣어야 해요.")) return; store.del("classToken"); store.del("classData"); store.del("msgSeen"); data = null; showLogin(); };
$("refresh").onclick = () => load(true);
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.v; store.set("classView", view, true); draw(); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && Date.now() - lastFetch > 5 * 60e3 && store.get("classToken")) load(); });

function got(d, keep){
  data = d; lastFetch = Date.now();
  store.set("classData", JSON.stringify({ d, at:Date.now() }), keep ?? !!localStorage.getItem?.("classToken"));
  $("loginView").hidden = true; $("appView").hidden = false; draw();
}
async function load(manual){
  const tok = store.get("classToken");
  if(!tok) return showLogin();
  if(manual) $("refresh").textContent = "…";
  try{ const r = await api({ token:tok }); if(r.relogin){ store.del("classToken"); return showLogin(r.error); } if(r.error) throw new Error(r.error); got(r.data); }
  catch(x){ if(!data) showLogin("인터넷 연결을 확인해 주세요."); else { const s = $("view").querySelector(".stale"); if(s) s.textContent = "새 내용을 받지 못했어요. 마지막으로 받은 내용이에요."; } }
  $("refresh").textContent = "↻";
}

function draw(){
  if(!data) return;
  $("title").firstChild.textContent = (data.cls ? data.cls + " " : "") + "우리 반 ";
  const t = new Date(), my = data.my;
  $("sub").textContent = (t.getMonth() + 1) + "월 " + t.getDate() + "일 " + WD[t.getDay()] + "요일" + (my ? " · " + my.no + "번 " + (my.name || "") + (my.who === "p" ? " 학부모" : "") : "");
  document.querySelectorAll("nav button").forEach(b => { b.setAttribute("aria-selected", String(b.dataset.v === view)); b.querySelector(".badge")?.remove(); });
  const unseen = view === "notes" ? 0 : newMsgs().length;
  if(unseen) document.querySelector('nav button[data-v="notes"]').append(el("span",{className:"badge",textContent:unseen,"aria-label":"새 알림 " + unseen + "개"}));
  const parts = [installTip(), ({ notes:drawNotes, events:drawEvents, checks:drawChecks, tt:drawTT })[view]?.() || drawNotes(),
    el("p",{className:"stale",textContent: "받은 시각 " + new Date(lastFetch).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" })})];
  $("view").replaceChildren(...parts.filter(Boolean));
}
// 개별 알림: 공지 탭을 열기 전까지 새 것은 탭에 숫자로 표시
const seenAt = () => Number(store.get("msgSeen")) || 0;
const newMsgs = () => (data.my?.msgs || []).filter(m => m.at > seenAt());
function drawMsgs(){
  const ms = data.my?.msgs || []; if(!ms.length) return "";
  const before = seenAt(); store.set("msgSeen", String(Math.max(before, ...ms.map(m => m.at))), true);
  const when = at => { const d = new Date(at); return label(ymd(d)) + " " + d.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }); };
  return [el("h2",{}, "나에게 온 알림", el("small",{textContent:"담임 선생님이 보냄"})),
    el("div",{className:"card msg"}, ...ms.slice(0, 10).map(m => el("div",{className:"note" + (m.at > before ? " new" : "")}, el("div",{className:"date",textContent:(m.at > before ? "새 알림 · " : "") + when(m.at)}), el("div",{className:"msgtext"}, ...linkify(m.text)))))];
}
function drawNotes(){
  const by = {}; data.notes.forEach(n => (by[n.date] ||= []).push(n));
  const t = today(), keys = Object.keys(by);
  const card = k => el("div",{className:"card" + (k === t ? " today" : "")}, el("div",{className:"date",textContent:(k === t ? "오늘 · " : "") + label(k)}),
    ...by[k].map(n => el("div",{className:"note"}, n.type ? el("span",{className:"tag",textContent:n.type}) : "", ...linkify(n.text), n.detail ? el("div",{className:"detail"}, ...linkify(n.detail)) : "")));
  const next = keys.filter(k => k > t).sort(), past = keys.filter(k => k < t).sort().reverse();
  return el("section",{}, drawMsgs(),
    el("h2",{textContent:"오늘 공지"}), by[t] ? card(t) : el("p",{className:"empty",textContent:"오늘은 공지가 없어요."}),
    next.length ? [el("h2",{textContent:"앞으로"}), ...next.map(card)] : "",
    past.length ? [el("h2",{}, "지난 공지", el("small",{textContent:"최근 3주"})), ...past.map(card)] : "");
}
function drawEvents(){
  const t = today(), list = data.events.filter(e => e.date >= ymd(new Date(Date.now() - 7 * 864e5)));
  if(!list.length) return el("p",{className:"empty",textContent:"다가오는 일정이 없어요."});
  const by = {}; list.forEach(e => (by[e.date.slice(0, 7)] ||= []).push(e));
  return el("section",{}, ...Object.keys(by).sort().map(m => [el("h2",{textContent:Number(m.slice(5)) + "월"}),
    el("div",{className:"card"}, ...by[m].map(e => el("div",{className:"ev" + (HOLI.test(e.title.replace(/\([^)]*\)/g, "")) ? " red" : "") + (e.date === t ? " on" : "")},
      el("span",{className:"d",textContent:label(e.date)}), el("span",{className:"t"}, e.mine ? el("span",{className:"tag",textContent:"학급"}) : "", e.title), e.date >= t ? ddTag(e.date) : "")))]));
}
function drawChecks(){
  if(!data.checks.length) return el("p",{className:"empty",textContent:"지금 걷고 있는 제출물이 없어요."});
  return el("section",{}, el("h2",{}, "낼 것", el("small",{textContent:"담임 선생님께 내요"})),
    el("div",{className:"card"}, ...data.checks.map(c => el("div",{className:"ev"}, el("span",{className:"t",textContent:c.title}),
      c.mine === true ? el("span",{className:"ok",textContent:"냈어요"}) : c.mine === false ? el("span",{className:"no",textContent:"아직"}) : "",
      c.due ? [el("span",{className:"d",textContent:label(c.due) + "까지"}), ddTag(c.due)] : el("span",{className:"d",textContent:"마감 없음"})))));
}
// 수업 시간: 선생님이 정한 것, 없으면 8:10 시작·50분 수업·10분 쉬고·4교시 뒤 점심 60분
function bells(){
  const out = []; let m = 8 * 60 + 10; const hm = x => String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0");
  for(let i = 0; i < 10; i++){ out.push({ s:hm(m), e:hm(m + 50) }); m += 50 + (i === 3 ? 60 : 10); }
  return out.map((d, i) => { const b = data.bells?.[i]; return b && b.s && b.e ? b : d; });
}
function drawTT(){
  // 학생별로 들어왔고 개인 시간표가 있으면 그것을 (선택 과목·이동 교실까지)
  const mine = data.my?.cells?.length ? { periods:data.my.cells.length, cells:data.my.cells } : null, tt = mine || data.tt;
  if(!tt) return el("p",{className:"empty",textContent:"시간표가 아직 없어요."});
  const now = new Date(), wd = now.getDay() - 1, hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0"), B = bells();
  const cur = wd >= 0 && wd < 5 ? B.slice(0, tt.periods).findIndex(b => hm >= b.s && hm < b.e) : -1;
  const cell = v => { const [a, b] = String(v || "").split("\n"); return [a || "", b ? el("small",{textContent:b}) : ""]; };
  return el("section",{}, el("h2",{}, mine ? (data.my.name || data.my.no + "번") + " 시간표" : "우리 반 시간표", mine ? el("small",{textContent:"반 숫자는 이동 교실"}) : ""),
    el("table",{className:"tt"}, el("thead",{}, el("tr",{}, el("th",{textContent:"교시"}), ...DAYS.map((d, j) => el("th",{className:j === wd ? "on" : "",textContent:d})))),
      el("tbody",{}, ...tt.cells.slice(0, tt.periods).map((r, i) => el("tr",{}, el("th",{}, String(i + 1), el("small",{textContent:B[i].s})),
        ...DAYS.map((_, j) => el("td",{className:(j === wd ? "on" : "") + (j === wd && i === cur ? " now" : "")}, ...cell(r[j]))))))),
    el("p",{className:"hint",textContent:"바뀐 수업은 조·종례 공지로 알려 줘요."}));
}
// 홈 화면에 추가 안내 (이미 앱으로 열었거나 닫았으면 안 보임)
let deferred = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; draw(); });
function installTip(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(standalone || store.get("installTipOff")) return null;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!deferred && !ios && !/android/i.test(navigator.userAgent)) return null;
  const x = el("button",{className:"x",type:"button",textContent:"✕","aria-label":"안내 닫기"}); x.onclick = () => { store.set("installTipOff", "1", true); draw(); };
  const body = deferred ? (() => { const b = el("button",{className:"small-btn",type:"button",textContent:"홈 화면에 추가"}); b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; draw(); }; return [el("span",{textContent:"앱처럼 쓰려면 "}), b]; })()
    : ios ? [el("span",{textContent:"앱처럼 쓰려면 사파리 아래 공유(□↑) → '홈 화면에 추가'를 누르세요."})]
    : [el("span",{textContent:"앱처럼 쓰려면 크롬 메뉴(⋮) → '홈 화면에 추가'를 누르세요."})];
  return el("div",{className:"install"}, el("img",{src:"icon-192.png",alt:""}), el("div",{}, ...body), x);
}

// 시작: 기억해 둔 내용을 먼저 보여 주고, 바로 새로 받음
try{ const c = JSON.parse(store.get("classData") || "null"); if(c && store.get("classToken")){ data = c.d; lastFetch = c.at; $("appView").hidden = false; draw(); } }catch{}
load();
setInterval(() => { if(data && view === "tt") draw(); }, 60e3);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
