<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>나의 교무수첩</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="교무수첩">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#26402e">
<base target="_blank">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: Tomorro 참고 — 짙은 숲색 머리띠(제목·탭), 흰 본문 위 옅은 민트 면, 연두 알약 버튼, 굵고 단단한 제목. Home is the "today" page: date, month calendar, and area cards. */
:root{
  --desk:#eef1e8; --paper:#ffffff; --paper2:#f4f7ef; --edge:#e1e6da; --ink:#1b2e21; --muted:#5f6f63; --line:#e2e7db; --dot:transparent;
  --ring:transparent; --sun:#e0533d; --sat:#3a6fd8;
  --navy:#3f6fb5; --green:#3c9a5f; --ochre:#d99a2b; --wine:#cf5c78; --slate:#7d887f;
  --accent:#2c5a3a; --danger:#d64532; --forest:#26402e; --forest-ink:#16301f; --lime:#7ee35f; --mint:#e6f8db;
  --display:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --body:var(--display);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0d1610; --paper:#152219; --paper2:#1a2a1f; --edge:#27392d; --ink:#e8f1e7; --muted:#9db0a2; --line:#27392d; --dot:transparent;
  --ring:transparent; --sun:#ff7a66; --sat:#8eb0ff;
  --navy:#86a8e6; --green:#6fcf8f; --ochre:#f0b54f; --wine:#f088a2; --slate:#a3afa6;
  --accent:#9be97f; --danger:#ff7a66; --forest:#0f1d14; --forest-ink:#10261a; --lime:#7ee35f; --mint:#1f3626; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0d1610; --paper:#152219; --paper2:#1a2a1f; --edge:#27392d; --ink:#e8f1e7; --muted:#9db0a2; --line:#27392d; --dot:transparent;
  --ring:transparent; --sun:#ff7a66; --sat:#8eb0ff;
  --navy:#86a8e6; --green:#6fcf8f; --ochre:#f0b54f; --wine:#f088a2; --slate:#a3afa6;
  --accent:#9be97f; --danger:#ff7a66; --forest:#0f1d14; --forest-ink:#10261a; --lime:#7ee35f; --mint:#1f3626; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font:15px/1.65 var(--body);word-break:keep-all;overflow-wrap:break-word} /* 한글은 낱말(띄어쓰기) 단위로만 줄바꿈 */
.desk{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.book{position:relative;max-width:920px;margin:0 auto;border-radius:6px 10px 10px 6px;
  background:radial-gradient(circle,var(--dot) 1px,transparent 1.4px) 0 0/20px 20px,var(--paper);
  box-shadow:0 2px 0 var(--edge),0 22px 40px -26px rgba(0,0,0,.4)}
/* punched holes + twin-wire rings, 34px pitch */
.book::before{content:"";position:absolute;top:20px;bottom:20px;left:12px;width:12px;pointer-events:none;
  background:radial-gradient(circle at 6px 12px,var(--desk) 4.5px,transparent 5px) 0 0/12px 34px repeat-y}
.book::after{content:"";position:absolute;top:20px;bottom:20px;left:-9px;width:27px;pointer-events:none;border-radius:3px;
  background:repeating-linear-gradient(to bottom,transparent 0 9px,var(--ring) 9px 11px,transparent 11px 13px,var(--ring) 13px 15px,transparent 15px 34px)}
.ribbon{position:absolute;top:0;right:56px;width:10px;height:52px;background:var(--cover,var(--slate));
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%)}
.inner{padding:26px clamp(18px,4vw,48px) 40px clamp(44px,6vw,64px)}
header{padding-block:0 14px}
h1{font:700 2.1rem/1.2 var(--display);margin:0;text-wrap:balance}
.term{color:var(--muted);font-size:.85rem;margin-top:2px;letter-spacing:.02em}
/* index tabs: top row on phones, sticking out of the right edge on wide screens */
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px}
nav button{font:700 1.1rem var(--display);border:0;cursor:pointer;color:var(--ink);padding:4px 14px;border-radius:8px 8px 0 0;
  background:color-mix(in srgb,var(--c,var(--slate)) 30%,var(--paper))}
nav button[aria-selected="true"]{background:color-mix(in srgb,var(--c,var(--slate)) 70%,var(--paper))}
@media (min-width:800px){
  .desk{padding-right:max(60px,env(safe-area-inset-right,0px))}
  nav{position:absolute;left:100%;top:70px;flex-direction:column;gap:6px;margin:0}
  nav button{writing-mode:vertical-rl;text-orientation:upright;width:36px;padding:14px 0;border-radius:0 8px 8px 0;letter-spacing:.1em;
    box-shadow:2px 2px 0 rgba(0,0,0,.05)}
  nav button[aria-selected="true"]{width:46px}
  nav .gear{margin-top:18px}
}
@media (prefers-reduced-motion:no-preference){nav button{transition:width .15s}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink)}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 10px;font-size:.82rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
/* 안내 문구는 화면 아래에 잠깐 떴다 사라지는 알림으로 (위에 끼어들어 화면을 밀지 않게) */
.status{position:fixed;inset:auto auto 18px 50%;transform:translateX(-50%);z-index:60;margin:0;max-width:min(560px,calc(100vw - 32px));width:max-content;
  padding:8px 14px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-size:.88rem;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .3s}
.status:empty,.status.gone{opacity:0;pointer-events:none}

/* home: today page */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,56px);align-items:start;margin-top:8px}
.date .md{display:block;font:700 clamp(3.6rem,11vw,5.6rem)/1 var(--display);font-variant-numeric:tabular-nums}
.date .dow{font:700 1.3rem var(--display);color:var(--muted)}
.date .dow.sun{color:var(--sun)} .date .dow.sat{color:var(--sat)}
.cal{margin-top:22px;max-width:300px}
.cal .cap{font:700 1.15rem var(--display);margin-bottom:4px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.cal .grid span{padding:4px 0}
.cal .h{font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.cal .s0{color:var(--sun)} .cal .s6{color:var(--sat)}
.cal .now{position:relative;font-weight:700}
.cal .now::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:26px;transform:translate(-50%,-50%) rotate(-8deg);
  border:2px solid var(--sun);border-radius:50% 45% 50% 40%}
.index h2{font:700 .8rem var(--body);letter-spacing:.3em;color:var(--muted);margin:6px 0 16px}
.tape{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;cursor:pointer;margin-bottom:18px;
  padding:10px 22px;font:700 1.7rem/1.2 var(--display);color:var(--ink);text-align:left;
  background:color-mix(in srgb,var(--c) 34%,transparent);
  clip-path:polygon(0 6%,2% 0,98% 5%,100% 0,99% 50%,100% 95%,97% 100%,3% 95%,0 100%,1% 50%);transform:rotate(-1.2deg)}
.tape:nth-of-type(even){transform:rotate(.9deg)}
.tape .go{font-size:1.1rem;color:var(--muted)}
.tape:hover,.tape:focus-visible{background:color-mix(in srgb,var(--c) 55%,transparent)}
@media (prefers-reduced-motion:no-preference){.tape{transition:background .15s}}
.tt{margin-top:34px}
.tt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tt-head h2{font:700 .8rem var(--body);letter-spacing:.3em;color:var(--muted);margin:0 auto 0 0}
.tt-tools{display:flex;gap:6px;flex-wrap:wrap}
.tt-wrap{overflow-x:auto}
.tt table{width:100%;min-width:420px;border-collapse:collapse;table-layout:fixed;background:var(--paper)}
.tt th,.tt td{border:1px solid var(--line);padding:6px 4px;height:40px;text-align:center;font-size:.85rem;overflow-wrap:anywhere}
.tt thead th{font:700 1.1rem var(--display)}
.tt thead th:first-child{font:500 .75rem var(--body);color:var(--muted)}
.tt tbody th{width:48px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tt .on{background:color-mix(in srgb,var(--sun) 9%,var(--paper))}
.tt thead th.on{color:var(--sun)}
.ttin{width:100%;font:inherit;font-size:.82rem;padding:4px 2px;border:1px solid var(--line);border-radius:4px;background:var(--paper2);color:var(--ink);text-align:center}
@media (max-width:640px){.today{grid-template-columns:1fr}.cal{max-width:none}}

/* area pages */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 45%,var(--paper));border-color:var(--c);font-weight:600}
.group h3{font:700 1.08rem var(--display);margin:24px 0 4px;display:flex;gap:8px;align-items:baseline}
.group h3 small{font:400 .8rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line)}
.row .main{flex:1;min-width:0}
.row .tools{display:flex;gap:6px;flex:none}
.frame{resize:vertical;overflow:hidden;height:520px;min-height:240px;margin:10px 0 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.frame iframe{width:100%;height:100%;border:0;display:block}
dialog label.check{display:flex;gap:8px;align-items:center;font-weight:400}
dialog label.check input{width:auto}
.row a.t{color:var(--ink);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.row a.t:hover{color:var(--c);text-decoration:underline}
.kind{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.05em;padding:0 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);margin-right:6px;vertical-align:1px}
.meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.note{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.empty{padding:10px 2px;color:var(--muted);font-size:.88rem;border-bottom:1px dashed var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0;min-height:86px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;box-shadow:0 1px 0 var(--edge)}
.card:hover{border-color:var(--c)}
.card .t{font-weight:600;line-height:1.4;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card a.t::after{content:"";position:absolute;inset:0}
.card .foot{display:flex;align-items:center;gap:4px}
.card .foot .kind{margin-right:auto}
.mini{position:relative;z-index:1;font:inherit;font-size:.75rem;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper2);color:var(--muted);cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--c)}
.card.open{grid-column:1/-1}
.card.open .t{-webkit-line-clamp:unset}
.card .frame{position:relative;z-index:1}

/* settings */
.set-area{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:16px;margin-bottom:16px;background:var(--paper2)}
.set-head{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.set-head label{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.field{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
.cat-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cat-row .field{flex:1}
.cat-row .n{font-size:.78rem;color:var(--muted);width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.icon{font:inherit;width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;flex:none}
.icon:disabled{opacity:.35;cursor:default}
.swatches{display:flex;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);outline:1px solid var(--line);background:var(--c);cursor:pointer}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.set-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-area label.inline{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem}
.carry{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.carry .note{flex-basis:100%;margin:0}
.nt-title{font:700 1.25rem var(--display);margin:0 0 4px}
#termSel{flex:0 1 auto}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;white-space:pre-line}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.45)}
dialog form{display:grid;gap:12px;padding:20px}
dialog h2{font:700 1.2rem var(--display);margin:0}
dialog label{display:grid;gap:4px;font-size:.85rem;font-weight:500}
dialog input,dialog select,dialog textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{font:inherit;padding:6px 16px;border:0;background:var(--paper2);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.actions .spacer{flex:1}
.group h3{font-size:1.35rem}
@media (max-width:520px){.two{grid-template-columns:1fr}h1{font-size:1.8rem}.ribbon{right:20px;height:40px}}

/* 한 화면 배치: 날짜·달력 | INDEX | 시간표 */
html{scrollbar-gutter:stable both-edges}
.book{max-width:1280px}
.inner{padding-top:20px;padding-bottom:28px}
header{padding-block:0 8px}
nav{margin-bottom:14px}
.today{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 32px;margin-top:0}
.today .tt{grid-column:1/-1}
@media (min-width:1100px){.today{grid-template-columns:210px minmax(0,.8fr) minmax(0,1.5fr)}.today .tt{grid-column:auto}}
@media (max-width:640px){.today{grid-template-columns:1fr}}
.date .md{font-size:clamp(2.8rem,6vw,4rem)}
.date .dow{font-size:1.1rem}
.cal{margin-top:10px}
.cal .grid span{padding:2px 0}
.tape{padding:7px 18px;font-size:1.4rem;margin-bottom:12px}
.index h2{margin:4px 0 12px}
.tt{margin:0}
.tt-head{margin-bottom:6px}
.tt-tools .btn.small{padding:3px 9px}
.tt table{min-width:360px}
.tt th,.tt td{height:30px;padding:2px 3px;font-size:.78rem;position:relative}
.tt thead th{font-size:1rem;line-height:1.1}
.tt thead th small{display:block;font:400 .68rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.tt tbody th{width:38px}
.tt td[tabindex]{cursor:pointer}
.tt td[tabindex]:hover{outline:1px solid var(--accent);outline-offset:-1px}
.tt td.nowcell,.tt td.nextcell,.tgrid td.nowcell,.tgrid td.nextcell{position:relative}
.tt td.nextcell,.tgrid td.nextcell{outline:2px dashed var(--sun);outline-offset:-3px}
.tgrid td.nowcell{outline:3px solid var(--sun);outline-offset:-3px;font-weight:700;background:color-mix(in srgb,var(--sun) 12%,var(--paper))}
.tt td.nowcell{outline:3px solid var(--sun);outline-offset:-3px;font-weight:700;background:color-mix(in srgb,var(--sun) 12%,var(--paper))}
.tt td.swap{background:color-mix(in srgb,var(--ochre) 22%,var(--paper));font-weight:600}
.ttback{position:absolute;top:0;right:1px;border:0;background:none;color:var(--muted);font-size:.7rem;line-height:1;padding:2px;cursor:pointer}
.ttback:hover{color:var(--ink)}

/* 홈 3단: 오늘·조종례 | 바로 가기·시간표 | 월별 달력·이번 주 일정 */
.home4{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:18px 28px;align-items:start}
@media (max-width:1150px){.home4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.home4 .col:last-child{grid-column:1/-1}}
@media (max-width:700px){.home4{grid-template-columns:1fr}}
.home4 .col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;align-content:start} /* 칸 폭을 넘는 긴 글(한 줄 할 일 이름)이 칸을 밀어내지 않게 */
.home4 .tt{margin:0}
.panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.panel-head>.tt-tools,.tt-head>.tt-tools{margin-left:auto;justify-content:flex-end}
.panel-head h2{font:700 .8rem var(--body);letter-spacing:.25em;color:var(--muted);margin:0 auto 0 0}
.datebox{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.datebox .md{font:700 clamp(3rem,6vw,4.4rem)/1 var(--display);font-variant-numeric:tabular-nums}
.datebox .dow{font:700 1.3rem var(--display);color:var(--muted)}
.datebox .dow.sun{color:var(--sun)} .datebox .dow.sat{color:var(--sat)}
.now{border-left:4px solid var(--sun);padding-left:18px}
.kids{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0}
.hrrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.hrrow .field{width:4.5em;padding:3px 6px}
.hrhead .hrrow,.hrhead .note{margin:0}
.kids.pics .kidthumb{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;margin-bottom:2px;background:var(--paper2)}
.kidpicopt{font-size:.8rem;color:var(--muted)}
.kids button{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 2px;font:inherit;font-size:.74rem;line-height:1.25;cursor:pointer;color:var(--ink);text-align:center;overflow:hidden}
.kids button b{display:block;font-weight:400;font-size:.64rem;color:var(--muted)}
.kids button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kids button:hover{background:var(--paper2)}
.kids button.ph b::after{content:" ●";color:var(--green);font-size:.55rem}
.kidphoto{display:block;max-width:100%;max-height:60vh;margin:6px auto;border-radius:8px}
.fcol{display:grid;gap:16px;align-content:start}
.ttterm{font-size:.7rem;font-weight:500;color:var(--muted);margin-left:6px}.ttterm.past{color:var(--wine)}
.alltools{flex-wrap:wrap}.alltools input[type=search]{flex:1 1 10em}
.subjname{flex:0 0 7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coolrow{display:grid;grid-template-columns:3.2em 3.2em minmax(0,1fr) auto;gap:6px;align-items:baseline;text-align:left;border:0;border-top:1px dashed var(--line);background:none;padding:6px 2px;font:inherit;color:inherit;cursor:pointer}

.budhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:4px}.budhead>b{font-size:1rem}.budhead>button{margin-left:auto}

.budrow:hover{background:rgba(0,0,0,.03)}.budrow .bn{grid-area:n;font-weight:600}.budrow .bm{grid-area:m;font-size:.78rem;color:var(--muted)}.budrow .br{grid-area:r;font-size:.85rem;white-space:nowrap}

.plan.pwtbl{min-width:0;table-layout:fixed}.pwtbl th:nth-child(1){width:4.2em}.pwtbl th:nth-child(3){width:42%}.pwtbl th:nth-child(4){width:4.6em}.pwtbl .field{width:100%;min-width:0;margin:0}

/* 휴대폰: 입력칸을 누를 때 화면이 커지지 않게 (아이폰은 16px 보다 작은 글씨 칸을 확대함), 두 번 눌러 확대도 막음 */

/* 선생님 시간표 */
#dayDlg:has(.tgrid){width:min(980px,calc(100vw - 32px))}
.tgrid{min-width:0}
.tgrid th,.tgrid td{font-size:.78rem;padding:4px 5px;text-align:center;vertical-align:middle}

.tchips{font-size:.8rem;max-height:calc(4 * 2.3em + 3 * 4px + 4px);overflow-y:auto;overscroll-behavior:contain;padding:2px;display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5em,1fr));gap:4px}

function termLabel(d = new Date()){
  const m = d.getMonth() + 1, y = m <= 2 ? d.getFullYear() - 1 : d.getFullYear();
  return `${y}학년도 ${m >= 3 && m <= 8 ? 1 : 2}학기`;
}

const termKey = (d = new Date()) => { const m = d.getMonth() + 1; return `${m <= 2 ? d.getFullYear() - 1 : d.getFullYear()}-${m >= 3 && m <= 8 ? 1 : 2}`; };
const nextTerm = k => { const [y, s] = k.split("-").map(Number); return s === 1 ? `${y}-2` : `${y+1}-1`; };
const termName = k => { const [y, s] = k.split("-"); return `${y}학년도 ${s}학기`; };

let viewTerm = null; // null이면 지금 학기
// 학기는 날짜로 저절로: 3~7월 1학기, 9~2월 2학기, 8월은 학사일정의 2학기 개학일(없으면 8/17)부터 2학기
const autoTerm = (d = new Date()) => { const k = termKey(d); if(d.getMonth() !== 7) return k; const y = k.slice(0, 4), s2 = findEv(/개학/, y + "-08-01", y + "-09-10") || y + "-08-17"; return ymd(d) >= s2 ? y + "-2" : y + "-1"; };

function renderCal(){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calOff);
  const y = base.getFullYear(), m = base.getMonth(), first = base.getDay(), days = new Date(y, m + 1, 0).getDate(), today = ymd(new Date());
  // 주말은 빼고 월~금만 (1일이 주말이면 첫 줄은 월요일부터)
  const cells = [...WD].map((w, i) => el("div",{className:"h s" + i}, w)).slice(1, 6);
  for(let i = 0; i < (first === 0 || first === 6 ? 0 : first - 1); i++) cells.push(el("div",{className:"blank"}));
  for(let n = 1; n <= days; n++){
    const d = new Date(y, m, n), k = ymd(d), evs = eventsOn(k);
    if(d.getDay() === 0 || d.getDay() === 6) continue;
    const cell = el("button",{type:"button",className:"day s" + d.getDay() + (k === today ? " now" : "") + (evs.some(isHoliday) ? " hol" : ""),
      "aria-label": dayLabel(d) + (evs.length ? ", " + evs.map(e => e.title).join(", ") : "")}, el("span",{className:"n"}, String(n)));
    evs.slice(0, 2).forEach(e => { const c = el("span",{className:"ev" + (isHoliday(e) ? " red" : ""),title:evCatName(e) + " · " + e.title}, e.title); if(evColor(e)) c.style.setProperty("--c", evColor(e)); cell.append(c); });
    if(evs.length > 2) cell.append(el("span",{className:"more"}, "+" + (evs.length - 2)));
    if(dues[k] || evDueOn(k)) cell.append(el("span",{className:"duetag",title:"마감일 (홈에 D-day로 보여요)"}, "마감"));
    else if(memos[k] || memoFiles[k]) cell.append(el("span",{className:"memo-dot",title:"메모 있음"}));
    cell.onclick = () => openDay(k);
    cells.push(cell);
  }
  const tools = el("div",{className:"tt-tools"},
    navBtn("‹", () => { calOff--; renderHome(); }, "지난달"),
    navBtn("이번 달", () => { calOff = 0; renderHome(); }, "이번 달", calOff === 0),
    navBtn("›", () => { calOff++; renderHome(); }, "다음 달"));
  if(canWrite()){

    file.onchange = async () => {
      const f = file.files[0]; file.value = ""; if(!f) return;
      try{ const list = await readEventsFile(f); await store.saveSchool(list); $("status").textContent = "학사일정 " + list.length + "개를 올렸어요. 전에 올린 학사일정은 이 파일로 바뀌었고, 내가 넣은 일정은 그대로예요."; }
      catch(e){ $("status").textContent = e?.message || "학사일정 파일을 읽지 못했어요."; }
    };
    tools.append(navBtn("일정 분류", () => openEvCats(), "내 일정 분류 나누기"), file, navBtn("올리기", () => file.click(), "학사일정 엑셀 올리기"), templateBtn("학사일정 양식.xlsx"));
  }
  return el("section",{className:"panel bigcal"},
    el("div",{className:"panel-head"}, el("h2",{}, y + "년 " + (m + 1) + "월"), tools),
    el("div",{className:"grid"}, ...cells));

// 첨부 파일 링크 (Claude 페이지는 /_blob/ 주소, 앱스스크립트는 드라이브 주소)
const fileHref = f => /^\/_blob\/[0-9a-f]{32}$/.test(f?.url || "") ? f.url : safeUrl(f?.url);

const driveIdOf = f => f?.fileId || (String(f?.url || "").match(/\/d\/([\w-]{20,})/) || String(f?.url || "").match(/[?&]id=([\w-]{20,})/) || [])[1] || "";

// 파일·사진 첨부 상자 (할 일·수업 기록·날짜 메모·제출물). onChange 가 있으면 올리거나 뺄 때 바로 저장
function attachBox(init, edit, onChange){
  const files = Array.isArray(init) ? init.slice() : [], box = el("div",{}), msg = el("div",{className:"err"});
  const changed = () => { draw(); if(onChange) onChange(files.slice()); };
  const draw = () => box.replaceChildren(files.length ? fileList(files, edit ? i => { files.splice(i, 1); changed(); } : null) : el("p",{className:"note"}, "첨부한 파일·사진이 없어요."));
  draw();
  const kids = [el("h3",{className:"sub"}, "파일·사진"), box];
  if(edit){
    const pick = el("input",{type:"file",hidden:true,multiple:true});
    pick.onchange = async () => {
      const fs = [...pick.files]; pick.value = "";
      for(const f of fs){
        if(files.length >= 10){ msg.textContent = "파일은 10개까지 넣을 수 있어요."; break; }
        msg.textContent = f.name + " 올리는 중…";
        try{ files.push(await store.uploadFile(f)); changed(); msg.textContent = ""; }
        catch(e){ msg.textContent = e?.message && !e.code ? e.message : "파일을 올리지 못했어요."; break; }
      }
    };
    kids.push(pick, el("div",{className:"actions"}, navBtn("파일·사진 올리기", () => pick.click(), "파일·사진 올리기")), msg);
  }
  return { node: el("div",{className:"attach"}, ...kids), files: () => files.slice() };
}

const dueLabel = k => { const n = Math.round((parseYmd(k) - parseYmd(ymd(new Date()))) / 864e5); return n < 0 ? "지남" : n === 0 ? "D-day" : "D-" + n; };
// 쿨메신저 글: 첫 줄(머리말 [교무부] 등은 뺌)을 할 일로, '10/30까지', '10월 30일(금) 마감', '~10.30' 을 마감일로
function parseMessage(text){
  const lines = String(text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const first = lines[0] || "", stripped = first.replace(/^[\[(【<][^\])】>]{0,20}[\])】>]\s*/, "");
  const all = lines.join(" ");
  const m = all.match(/(\d{1,2})\s*[.\/월]\s*(\d{1,2})\s*일?\s*(?:\([^)]*\))?\s*(?:\d{1,2}\s*[:시]\s*\d{0,2}\s*분?\s*)?(?:까지|마감)/) || all.match(/~\s*(\d{1,2})\s*[.\/월]\s*(\d{1,2})/);
  return { text:(stripped || first).slice(0, 60), detail:String(text || "").trim().slice(0, 2000), due: m ? (mdToYmd(+m[1], +m[2]) || "") : "" };
}

// '1 김가람', '1번 김가람', '1<탭>김가람', 이름만 (번호는 이어서 매김)
function parseStudents(text){
  const out = []; let auto = 1;
  for(const line of String(text || "").split(/\r?\n/)){
    const t = line.trim(); if(!t) continue;
    const m = t.match(/^(\d{1,2})\s*번?[\t ,.)]*\s*(.+)$/);
    if(m && m[2].trim()){ out.push({ no:+m[1], name:m[2].split("\t")[0].trim().slice(0, 20) }); auto = +m[1] + 1; }
    else out.push({ no:auto++, name:t.split("\t")[0].trim().slice(0, 20) });
  }
  const seen = new Set();
  return out.filter(s => s.no >= 1 && s.no <= 50 && s.name && !seen.has(s.no) && seen.add(s.no)).sort((a, b) => a.no - b.no);
}

// 사진은 600px 정도로 줄여서 올림 (불러오기 빠르게)
async function shrinkImage(f, max = 600){
  const url = URL.createObjectURL(f);
  try{
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(f.name + ": 열 수 없는 사진이에요 (jpg·png로 올려 주세요).")); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85).split(",")[1];
  }finally{ URL.revokeObjectURL(url); }
}

}

function parseRoster(rows){
  const norm = s => String(s ?? "").replace(/\s/g, "");
  for(let h = 0; h < Math.min(rows.length, 30); h++){

    const isParent = c => /(보호자|학부모|부모|어머니|아버지|엄마|아빠|모친|부친|가정)/.test(c);
    let stuC = phoneCols.find(k => /(학생|본인)/.test(head[k]));
    if(stuC === undefined) stuC = phoneCols.find(k => !isParent(head[k]));
    const parentCols = phoneCols.filter(k => k !== stuC);
    const relCols = head.map((c, k) => /관계/.test(c) ? k : -1).filter(k => k >= 0);
    const relFor = k => { const left = relCols.filter(r => r < k).pop(); return left !== undefined && !parentCols.some(p => p > left && p < k) ? left : -1; };
    const noteC = head.findIndex(c => /^(비고|메모|특이사항)$/.test(c));

      if(!(no >= 1 && no <= 50) || !name) continue;
      const parents = parentCols.map(k => {
        const rc = relFor(k), labelRel = (head[k].match(/(어머니|아버지|엄마|아빠|모|부|할머니|할아버지)/) || [])[1] || "";
        return { rel:String(rc >= 0 ? row[rc] ?? "" : labelRel).trim().slice(0, 10), phone:phoneOf(row[k]) };

const undoStack = [];
let undoing = false;
const UNDO_DEF = { done:false, closed:false, share:true, files:[], text:"", detail:"", due:"", size:30, memo:"", memoShare:true };
const before = (o, p) => Object.fromEntries(Object.keys(p).map(k => [k, o && o[k] !== undefined ? structuredClone(o[k]) : (k in UNDO_DEF ? structuredClone(UNDO_DEF[k]) : "")]));

const redoStack = [];
let redoing = false;
function pushUndo(x){ undoStack.push(x); if(undoStack.length > 30) undoStack.shift(); if(!redoing) redoStack.length = 0; }
function wrapUndo(name, mk){
  const f = store[name];
  store[name] = (...a) => { if(!undoing){ try{ const u = mk(...a); if(u) pushUndo({ label:u[0], run:u[1], redo:u[2] || (() => store[name](...a)) }); }catch(e){} } return f(...a); };
}

document.addEventListener("keydown", async e => {
  const k = e.key.toLowerCase(), redo = k === "y" || (k === "z" && e.shiftKey);
  if(!(e.ctrlKey || e.metaKey) || e.altKey || (k !== "z" && k !== "y")) return;
  const a = document.activeElement;
  if(a && (a.isContentEditable || (/^(INPUT|TEXTAREA)$/.test(a.tagName) && !/^(checkbox|radio|button|file|date|time|number)$/.test(a.type)))) return; // 글 쓰는 칸 안에서는 글자 되돌리기
  e.preventDefault(); redo ? doRedo() : doUndo();
});
async function doUndo(){
  const u = undoStack.pop();
  if(!u) return say("되돌릴 것이 없어요.");
  if(!canWrite()) return say("지금은 되돌릴 수 없어요.");
  undoing = true;
  try{ await u.run(); if(u.redo) redoStack.push(u); say("되돌렸어요: " + u.label + " (↷ 로 다시 할 수 있어요)"); $("dayDlg")?.open && $("dayDlg").close(); }
  catch(x){ undoStack.push(u); say("되돌리지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  finally{ undoing = false; }
}
// 되돌린 것을 다시: 처음 한 것을 그대로 다시 부름 (그러면 되돌리기 기록도 새로 생김)
async function doRedo(){
  const r = redoStack.pop();
  if(!r) return say("다시 할 것이 없어요.");
  if(!canWrite()) return say("지금은 다시 할 수 없어요.");
  redoing = true;
  try{ await r.redo(); say("다시 했어요: " + r.label); $("dayDlg")?.open && $("dayDlg").close(); }
  catch(x){ redoStack.push(r); say("다시 하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }

function checkDraft(d){
  const problems = [];
  d.areas.forEach(a => {
    a.name = a.name.trim();
    a.cats.forEach(c => c.name = c.name.trim());
    if(!a.name) problems.push("영역 이름이 비어 있어요.");
    if(!a.cats.length) problems.push(`${a.name || "영역"}: 분류가 하나는 있어야 해요.`);
    if(a.cats.some(c => !c.name)) problems.push(`${a.name}: 이름이 빈 분류가 있어요.`);
    const names = a.cats.map(c => c.name); if(new Set(names).size !== names.length) problems.push(`${a.name}: 같은 이름의 분류가 있어요.`);
    const old = areaOf(a.id);
    old?.cats.filter(c => !a.cats.some(x => x.id === c.id)).forEach(c => {
      const n = items.filter(it => it.area === a.id && catOf(old, it) === c).length;
      if(n) problems.push(`${a.name} › ${c.name}: 항목 ${n}개가 있어 지울 수 없어요. 먼저 다른 분류로 옮겨 주세요.`);
    });
  });
  return problems;
}

call("getAll").then(d => { apply(d); try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch{} })
  .catch(e => { $("status").textContent = "불러오지 못했어요: " + (e?.message || "새로 고침 해 주세요."); });
</script>
